services:
  api:
    build: ./app
    ports:
      - "5000:5000"
    networks:
      - lab03

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lab03

networks:
  lab03:
