name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ../project-01-nodejs-app
          push: false
          tags: project01:ci
          load: true

      - name: Smoke test
        run: |
          docker run -d --name ci-api -e DATABASE_URL=postgres://u:p@localhost:5432/db project01:ci || true
          docker rm -f ci-api 2>/dev/null || true

  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ../project-01-nodejs-app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project01:latest
