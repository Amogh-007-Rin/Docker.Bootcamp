services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - order-service
    networks:
      - msnet

  user-service:
    build: ./user-service
    networks:
      - msnet

  order-service:
    build: ./order-service
    networks:
      - msnet

networks:
  msnet:
    driver: bridge
