services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  stress:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do :; done"]
    mem_limit: 32m
    cpus: 0.25
