services:
  web:
    build:
      context: ./web
    image: docker-mastery/web:1.0
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - db
      - cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-net

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net

  cache:
    image: redis:7.2
    command: ["redis-server", "--save", "60", "1"]
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db-data:
